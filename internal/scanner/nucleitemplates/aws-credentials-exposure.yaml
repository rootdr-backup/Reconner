id: reconner-aws-credentials-exposure
info:
  name: Exposed AWS shared credentials file
  author: reconner
  severity: critical
  description: A publicly readable AWS shared credentials file discloses an access-key pair. Matchers require the native INI structure and both credential keys.
  tags: reconner,exposure,aws,secret,credentials
http:
  - method: GET
    path:
      - "{{BaseURL}}/.aws/credentials"
      - "{{BaseURL}}/aws/credentials"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "(?m)^\\s*\\[[A-Za-z0-9_.-]+\\]\\s*$"
          - "(?m)^\\s*aws_access_key_id\\s*=\\s*(AKIA|ASIA)[A-Z0-9]{16}\\s*$"
          - "(?m)^\\s*aws_secret_access_key\\s*=\\s*[A-Za-z0-9/+=]{32,}\\s*$"
        condition: and
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "text/html"
        negative: true

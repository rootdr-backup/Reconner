id: reconner-git-head-exposure
info:
  name: Exposed .git/HEAD
  author: reconner
  severity: medium
  description: A readable .git/HEAD confirms an exposed .git directory even when .git/config is blocked, enabling repository reconstruction.
  tags: reconner,exposure,git,disclosure
http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/HEAD"
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "(?m)^ref:\\s+refs/heads/[A-Za-z0-9._/-]+\\s*$"
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "text/html"
        negative: true

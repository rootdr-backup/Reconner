name: docker-image

# Build the container image on every push to main and on every version tag,
# and publish it to the GitHub Container Registry (ghcr.io). Pull requests build
# the image (to catch breakage) but do NOT push.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  # ghcr image names MUST be lowercase — hardcoded so an org/repo with an
  # uppercase letter (e.g. rootdr-backup/Reconner) still produces a valid ref.
  IMAGE: ghcr.io/rootdr-backup/reconner

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build-and-scan:
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive build identity
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})" >&2
            exit 1
          fi
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.arch }} image for security verification
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          outputs: type=docker,dest=/tmp/reconner-${{ matrix.arch }}.tar
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            VCS_REF=${{ steps.build.outputs.revision }}
            BUILD_DATE=${{ steps.build.outputs.created }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Reject vulnerable ${{ matrix.arch }} image contents and leaked secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/reconner-${{ matrix.arch }}.tar
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  push-platform:
    if: github.event_name != 'pull_request'
    needs: build-and-scan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive build identity
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})" >&2
            exit 1
          fi
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified ${{ matrix.arch }} image by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            VCS_REF=${{ steps.build.outputs.revision }}
            BUILD_DATE=${{ steps.build.outputs.created }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}

      - name: Export image digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-verified:
    if: github.event_name != 'pull_request'
    needs: push-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Publish verified multi-platform manifest
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$TAGS_JSON")
          mapfile -t digests < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${#digests[@]}" -eq 2 ]] || {
            echo "Expected two verified platform digests, found ${#digests[@]}" >&2
            exit 1
          }
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
  # Isolated write permission: normal branch/PR image builds remain read-only.
  # Publishing waits for the verified multi-platform manifest, so the in-app
  # notice never races an unavailable container.
  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: push-verified
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "Reconner $GITHUB_REF_NAME" --latest

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>Reconner · Watchtower</title>
    <!-- Fonts are SELF-HOSTED from /fonts (Vazirmatn + JetBrains Mono, woff2).
         No external webfont CDN on purpose: a render-blocking Google Fonts
         request hangs the whole app on a server that can't reach it
         (firewalled / air-gapped / slow), which showed as an endless loading
         spinner. Local files render instantly and work offline. -->
    <link rel="preload" href="/fonts/Vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
